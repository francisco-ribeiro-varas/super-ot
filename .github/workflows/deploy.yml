name: Deploy Django to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          source: "."
          target: "/home/${{ secrets.USER }}/ot/"
          rm: false

      - name: Execute remote commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.KEY }}
          envs: >
            DEBUG,SECRET_KEY,ALLOWED_HOSTS,DB_NAME,DB_USER,DB_PASSWORD,DB_HOST,DB_PORT
          script: |
            set -e

            # Navegar al directorio del proyecto
            cd /home/${{ secrets.USER }}/ot

            # Crear archivo .env con las variables de GitHub Secrets
            cat <<EOT > .env
            DEBUG=${DEBUG}
            SECRET_KEY=${SECRET_KEY}
            ALLOWED_HOSTS=${ALLOWED_HOSTS}
            DB_NAME=${DB_NAME}
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            DB_HOST=${DB_HOST}
            DB_PORT=${DB_PORT}
            EOT

            # Actualizar repositorios e instalar dependencias del sistema para Ubuntu 20.04
            sudo apt-get update
            sudo apt-get install -y software-properties-common
            
            # Agregar el PPA de deadsnakes para obtener Python 3.11 (no viene por defecto en 20.04)
            sudo add-apt-repository ppa:deadsnakes/ppa -y
            sudo apt-get update

            # Instalar Python 3.11 y dependencias de desarrollo para base de datos
            # Nota: libmariadb-dev es el equivalente a mariadb-devel
            sudo apt-get install -y python3.11 python3.11-venv python3.11-dev libmariadb-dev pkg-config gcc

            # Configurar el entorno virtual si no existe o si es de otra versión
            if [ ! -f "venv/bin/python3.11" ]; then
              echo "Creando nuevo entorno virtual con Python 3.11..."
              rm -rf venv
              python3.11 -m venv venv
            fi

            # Activar entorno virtual e instalar librerías de Python
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # Tareas de Django
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

            # Reiniciar el servidor de aplicaciones (Gunicorn)
            # Asegúrate de que el servicio de gunicorn esté configurado en tu EC2
            sudo systemctl restart gunicorn

        env:
          DEBUG: ${{ secrets.DEBUG }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ALLOWED_HOSTS: ${{ secrets.ALLOWED_HOSTS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}